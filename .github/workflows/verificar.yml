name: Verificar

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Instalar dependências da interface
        run: npm ci
        working-directory: app
      - name: Compilar interface
        run: npm run build
        working-directory: app
      - name: Conferir formatação Rust
        run: cargo fmt --all -- --check
        working-directory: app/src-tauri
      - name: Testar núcleo Rust
        run: cargo test --locked --lib
        working-directory: app/src-tauri
      - name: Compilar pacote Windows
        run: npm run tauri -- build
        working-directory: app
      - name: Publicar artefatos de validação
        uses: actions/upload-artifact@v4
        with:
          name: canoa-windows-${{ github.sha }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/canoa.exe
          if-no-files-found: error
